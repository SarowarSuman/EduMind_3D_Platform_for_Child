<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 110" width="440" height="110" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="0.5" stop-color="#c026d3"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="orbGlass" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.12"/>
    </radialGradient>
    <clipPath id="pill"><rect x="15" y="15" width="410" height="80" rx="40"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="190%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="txt" x="-10%" y="-20%" width="120%" height="150%"><feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#2e1065" flood-opacity="0.5"/></filter>
  </defs>

  <!-- outer glow -->
  <rect x="25" y="25" width="390" height="70" rx="35" fill="url(#base)" opacity="0.55" filter="url(#glow)"/>

  <!-- colour body -->
  <rect x="15" y="15" width="410" height="80" rx="40" fill="url(#base)"/>

  <!-- liquid blobs -->
  <g clip-path="url(#pill)" filter="url(#blur)">
    <circle cx="90" cy="45" r="34" fill="#22d3ee" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 150,22; 40,-6; 0,0" dur="7s" repeatCount="indefinite"/>
    </circle>
    <circle cx="330" cy="75" r="36" fill="#fde047" opacity="0.85">
      <animateTransform attributeName="transform" type="translate" values="0,0; -170,-24; -60,6; 0,0" dur="8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="220" cy="20" r="28" fill="#f472b6" opacity="0.9">
      <animateTransform attributeName="transform" type="translate" values="0,0; 90,40; -80,30; 0,0" dur="9s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- glass layer -->
  <rect x="15" y="15" width="410" height="80" rx="40" fill="#fff" fill-opacity="0.16"/>
  <g clip-path="url(#pill)">
    <path d="M15 15 H425 V50 Q220 72 15 50 Z" fill="url(#gloss)" opacity="0.8"/>
    <rect x="-120" y="10" width="90" height="90" fill="url(#sweep)" transform="skewX(-20)">
      <animateTransform attributeName="transform" type="translate" additive="sum" values="0,0; 640,0" dur="3.2s" repeatCount="indefinite"/>
    </rect>
  </g>
  <rect x="15.75" y="15.75" width="408.5" height="78.5" rx="39.25" fill="none" stroke="url(#rim)" stroke-width="1.5"/>

  <!-- play orb -->
  <circle cx="75" cy="55" r="28" fill="#fff" fill-opacity="0.18">
    <animate attributeName="r" values="28;33;28" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="fill-opacity" values="0.22;0.04;0.22" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="75" cy="55" r="25" fill="url(#orbGlass)" stroke="#fff" stroke-opacity="0.8" stroke-width="1.3"/>
  <path d="M69 43 L69 67 L90 55 Z" fill="#fff" filter="url(#txt)"/>

  <!-- text -->
  <g font-family="Poppins,'Segoe UI',Arial,sans-serif" filter="url(#txt)">
    <text x="122" y="54" font-size="29" font-weight="700" fill="#fff">Live Demo</text>
    <text x="123" y="76" font-size="13.5" font-weight="500" fill="#fff" fill-opacity="0.95">Try EduMind in your browser</text>
  </g>

  <!-- arrow orb -->
  <circle cx="385" cy="55" r="19" fill="url(#orbGlass)" stroke="#fff" stroke-opacity="0.8" stroke-width="1.2"/>
  <path d="M378 55 H392 M386 48 L393 55 L386 62" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <animateTransform attributeName="transform" type="translate" values="0,0;3,0;0,0" dur="1.4s" repeatCount="indefinite"/>
  </path>
</svg>
